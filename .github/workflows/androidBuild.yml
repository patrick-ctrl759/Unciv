# Verifies the Android module actually builds (debug variant, no signing needed).
# Separate from buildAndTest.yml (which only compiles+checks) and buildAndDeploy.yml
# (which does the full signed release build, only on tag push).

name: Android build

on:
  workflow_dispatch:
  push:
    paths:
      - 'build.gradle.kts'
      - 'gradle-wrapper.properties'
      - 'gradle/libs.versions.toml'
      - 'android/build.gradle.kts'
      - '.github/workflows/androidBuild.yml'
  pull_request_target:
    paths:
      - 'build.gradle.kts'
      - 'gradle-wrapper.properties'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/androidBuild.yml'
      - 'android/build.gradle.kts'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  android-build:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Build Android debug APK
        run: ./gradlew :android:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Unciv-Modificado
          path: android/build/outputs/apk/debug/*.apk
